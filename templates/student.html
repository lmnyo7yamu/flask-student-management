<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Student</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h2>New Student Information</h2>
    <button onclick="toggleDarkMode()" class="btn" style="background-color: #555;">🌙 Dark Mode</button>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="{% if category == 'error' %}error-msg{% else %}success-msg{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('addrec') }}" method="POST">
        Name <br>
        <input type="text" name="nm" required /><br>

        Age <br>
        <input type="number" name="age" required /><br>

        Address <br>
        <textarea name="add" required></textarea><br>

        City <br>
        <input type="text" name="city" required /><br>

        PIN Code <br>
        <input type="text" name="pin" required placeholder="Numbers only" /><br>

        <input type="submit" value="Save" />
    </form>
    <br>
    <a href="{{ url_for('home') }}" class="btn" style="background-color: #6c757d;">Back to Home</a>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle("dark-mode");
        }
    </script>
</body>
</html>
